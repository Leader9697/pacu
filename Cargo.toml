[package]
name = "pacu"
version = "0.6.0"
edition = "2021"
description = "Pacu: penyeimbang CPU dan booster gaming yang ringan untuk Windows"
license = "MIT"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pacu"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parking_lot = "0.12"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
rfd = "0.15"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["pawnio"]
# Sertakan modul PawnIO (res/pawnio/*.bin) untuk suhu dan daya CPU.
pawnio = []

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Hanya untuk build dan uji di Linux saat pengembangan.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
